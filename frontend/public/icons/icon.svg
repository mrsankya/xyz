<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="512" height="256" rx="128" fill="url(#glow)" />

  <!-- Logistics Network Circular Nodes & Circuit Traces -->
  <g opacity="0.28" stroke="#a7f3d0" stroke-width="6" fill="none" stroke-linecap="round">
    <circle cx="256" cy="256" r="180" stroke-dasharray="16 12" />
    <line x1="256" y1="76" x2="256" y2="136" />
    <line x1="256" y1="376" x2="256" y2="436" />
    <line x1="76" y1="256" x2="136" y2="256" />
    <line x1="376" y1="256" x2="436" y2="256" />
    <circle cx="256" cy="76" r="10" fill="#a7f3d0" />
    <circle cx="256" cy="436" r="10" fill="#a7f3d0" />
    <circle cx="76" cy="256" r="10" fill="#a7f3d0" />
    <circle cx="436" cy="256" r="10" fill="#a7f3d0" />
  </g>

  <!-- Central Sprout Emblem with Logistics Ring -->
  <g filter="url(#shadow)">
    <!-- Shield / Hexagon core -->
    <circle cx="256" cy="256" r="128" fill="#064e3b" />
    
    <!-- Sprout Icon -->
    <path d="M256 160 C256 160 330 170 330 250 C330 290 300 320 256 320 C212 320 182 290 182 250 C182 170 256 160 256 160 Z" fill="url(#leafGrad)" />
    <!-- Sprout stem line -->
    <path d="M256 220 L256 360" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <!-- Sprout left shoot -->
    <path d="M256 290 C220 290 200 270 200 240 C225 240 250 260 256 290 Z" fill="#ffffff" opacity="0.9" />
    <!-- Sprout right shoot -->
    <path d="M256 260 C290 260 310 240 310 215 C285 215 262 235 256 260 Z" fill="#a7f3d0" />
  </g>
</svg>
