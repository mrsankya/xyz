services:
  - type: web
    name: agrilogix-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_NAME
        value: AgriLogix API
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://agrilogix.pages.dev
      - key: DATABASE_URL
        fromDatabase:
          name: agrilogix-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  - name: agrilogix-db
    plan: free
    databaseName: agrilogix
    user: agrilogix
